name: release
# Release CI for the Shaft Analyser, run here (a public repository: GitHub's Windows, Linux and macOS runners are free)
# on the private source repository's main branch. tools/release.sh starts it the moment main is pushed; a schedule
# (every 5 minutes, which GitHub often runs hours late) is the fallback. It looks for a commit on main that has no release
# yet; then, side by side: the unit tests; the build, then on clean Windows, Linux and macOS the one-line install
# (migrating a planted earlier install), self-check against ground truth, doctor and serve test, and a copy of the
# previous release updating itself to this build (served on the runner the way github.com serves a release). Only when
# every one of those passed is the release published here, where installed copies pick it up on their own; then the
# release is checked as github.com serves it. A failure opens an issue in the source repository and publishes nothing.
# dry_run: every check, then nothing published (no release, no tag, no issue). source_ref (only with dry_run): rehearse
# the whole pipeline on that branch or commit of the source repository instead of main; a real release is always main.
# The checks: unit tests (backend pytest, launcher go vet + go test) on Windows, Linux and macOS; verify and update-e2e
# below; and the client-machine scenarios of scenarios.yml (held folders, a running app, one app per install, a broken
# next version, odd profile paths, offline / no desktop / read-only / full disk), all side by side after the build.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main's commit already has a release"
        type: boolean
        default: false
      dry_run:
        description: "Run every check, publish nothing (no release, no tag, no issue)"
        type: boolean
        default: false
      source_ref:
        description: "Dry run only: source branch or commit to check instead of main (a release is always main)"
        type: string
        default: ""

run-name: ${{ inputs.dry_run && format('release (dry run{0})', inputs.source_ref != '' && format(' of {0}', inputs.source_ref) || '') || 'release' }}

concurrency:
  # one release at a time; a dry run has a group of its own (it never waits for a release, nor holds one up)
  group: ${{ inputs.dry_run && format('release-dry-run-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASES_REPO: ${{ github.repository }}
  SOURCE_REPO: Saif0089/delta_scan_shaft_analyser
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      sha: ${{ steps.d.outputs.sha }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REL_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          ref=main
          if [ -n "$SOURCE_REF" ]; then
            [ "$DRY_RUN" = true ] || { echo "::error::source_ref is for dry runs only: a release is always made from main"; exit 1; }
            ref=$SOURCE_REF
          fi
          sha=$(gh api "repos/$SOURCE_REPO/commits/$(printf %s "$ref" | jq -sRr @uri)" -q .sha)
          [ ${#sha} = 40 ] || { echo "::error::cannot resolve $ref in $SOURCE_REPO"; exit 1; }
          last=$(GH_TOKEN=$REL_TOKEN gh release view --repo "$RELEASES_REPO" --json body -q .body 2>/dev/null | grep -o 'Commit: [0-9a-f]\{40\}' | cut -d' ' -f2 || true)
          base=$(gh api "repos/$SOURCE_REPO/contents/VERSION?ref=$sha" -q .content | base64 -d | tr -d '[:space:]')
          n=$(GH_TOKEN=$REL_TOKEN gh release list --repo "$RELEASES_REPO" --limit 100 --json tagName -q '.[].tagName' | grep "^v$base\." | sed "s/^v$base\.//" | sort -n | tail -1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=v$base.$(( ${n:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          # a source_ref rehearsal always runs, also on a commit already released (else every job skips and it looks green)
          if [ "$sha" != "$last" ] || [ "${{ inputs.force }}" = "true" ] || [ -n "$SOURCE_REF" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
          echo "$ref $sha · last released $last · next v$base.$(( ${n:-0} + 1 ))"

  test:
    # on each OS the release runs on: a Windows-only failure blocks the release too
    needs: decide
    if: needs.decide.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { repository: "${{ env.SOURCE_REPO }}", ref: "${{ needs.decide.outputs.sha }}", token: "${{ secrets.SOURCE_TOKEN }}" }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache-dependency-path: launcher/go.mod }
      - name: Backend unit tests
        working-directory: backend
        run: uv sync --python 3.12 --frozen && uv run pytest -q
      - name: Launcher tests
        working-directory: launcher
        # CI is set on purpose: the Windows tests that change the registry, PATH and shortcuts (install.ps1, the
        # Known Folders search, app-* folders) skip without it. -count=1: never a cached pass.
        env:
          CI: "true"
        run: go vet ./... && go test -count=1 ./...

  build:
    # alongside the unit tests (publish needs both)
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: "${{ env.SOURCE_REPO }}", ref: "${{ needs.decide.outputs.sha }}", token: "${{ secrets.SOURCE_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - id: go
        uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - name: Go modules and build cache (go-winres; the standard library for the three targets)
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('launcher/go.mod') }}-winres-0.3.3
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      - id: v
        run: echo "version=${{ needs.decide.outputs.version }}" >> "$GITHUB_OUTPUT"
      - name: Web app, launchers and synthetic shaft (built side by side)
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          web() {
            cd frontend
            # the web app's tests and lint come before its build: a failure here blocks the release
            npm ci && npm test && npm run lint && npm run build
          }
          launchers() {
            cd launcher
            mkdir -p ../dist-bin
            # the Windows program carries the logo and its version (Explorer, taskbar, shortcuts)
            go install github.com/tc-hib/go-winres@v0.3.3
            W=${V#v}.0
            "$(go env GOPATH)/bin/go-winres" simply --icon ../packaging/icons/logo-512.png --manifest cli \
              --product-name "Shaft Analyser" --file-description "Shaft Analyser" --original-filename shaft-analyser.exe \
              --copyright "Delta Scan Engineering" --product-version "$W" --file-version "$W"
            for t in windows/amd64 linux/amd64 darwin/arm64; do
              o=${t%/*}; a=${t#*/}; ext=; [ "$o" = windows ] && ext=.exe
              GOOS=$o GOARCH=$a CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=$V" \
                -o ../dist-bin/shaft-analyser-$o-$a$ext .
            done
          }
          sample() {
            cd backend
            uv sync --python 3.12 --frozen --no-dev
            uv run --no-dev python -c "from shaft.testing.synth import generate, SynthParams; generate('../synthetic_shaft.laz', SynthParams())"
          }
          parts="web launchers sample"
          declare -A pid
          for p in $parts; do
            (set -e; $p) > "$RUNNER_TEMP/$p.log" 2>&1 &
            pid[$p]=$!
          done
          rc=0
          for p in $parts; do
            if wait "${pid[$p]}"; then
              echo "::group::$p: ok"; cat "$RUNNER_TEMP/$p.log"; echo "::endgroup::"
            else
              rc=1; echo "::error::$p failed"; cat "$RUNNER_TEMP/$p.log"
            fi
          done
          exit $rc
      - name: Package
        run: python3 packaging/make_release.py ${{ steps.v.outputs.version }} dist dist-bin synthetic_shaft.laz
      # one artifact per platform package and one for the rest: each check downloads only what it installs, publish all
      - uses: actions/upload-artifact@v4
        with:
          name: release-common
          path: |
            dist/*
            !dist/ShaftAnalyser-*.zip
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with: { name: release-windows-x64, path: dist/ShaftAnalyser-*-windows-x64.zip, retention-days: 14, compression-level: 0, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: release-linux-x64, path: dist/ShaftAnalyser-*-linux-x64.zip, retention-days: 14, compression-level: 0, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: release-macos-arm64, path: dist/ShaftAnalyser-*-macos-arm64.zip, retention-days: 14, compression-level: 0, if-no-files-found: error }

  verify:
    needs: [decide, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows-x64, exe: shaft-analyser.exe }
          - { os: ubuntu-latest, plat: linux-x64, exe: shaft-analyser }
          - { os: macos-14, plat: macos-arm64, exe: shaft-analyser }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SHAFT_AUTO_UPDATE: "0"
      SHAFT_NOTIFY: "0"
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-common, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: "release-${{ matrix.plat }}", path: dist }
      - name: Serve the release locally (the installer downloads from it exactly as from GitHub)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          cd dist && ("$PY" -m http.server 8011 --bind 127.0.0.1 > ../http.log 2>&1 &)
          for i in $(seq 30); do curl -sf http://127.0.0.1:8011/checksums.txt > /dev/null && break; sleep 1; done
      - name: Leave an earlier Shaft Analyser behind (data, program, shortcut) for the installer to migrate
        shell: bash
        run: |
          H="$HOME"; [ "$RUNNER_OS" = Windows ] && H="$(cygpath -u "$USERPROFILE")"
          mkdir -p "$H/ShaftAnalyser/shafts/old-shaft" && echo '{"id":"old-shaft","name":"Old shaft"}' > "$H/ShaftAnalyser/shafts/old-shaft/shaft.json"
          if [ "$RUNNER_OS" = Windows ]; then
            mkdir -p "$H/Downloads/ShaftAnalyser/_internal" "$H/Downloads/ShaftAnalyser/config"
            cp "$(command -v cmd.exe || echo /c/Windows/System32/cmd.exe)" "$H/Downloads/ShaftAnalyser/ShaftAnalyser.exe"
            echo "x: 1" > "$H/Downloads/ShaftAnalyser/config/defaults.yaml"
          fi
      - name: Install with the one-line command (macOS / Linux)
        if: runner.os != 'Windows'
        env: { SHAFT_RELEASE_URL: "http://127.0.0.1:8011", SHAFT_NO_START: "1" }
        run: curl -fsSL http://127.0.0.1:8011/install.sh | sh
      - name: Install with the one-line command (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        env: { SHAFT_RELEASE_URL: "http://127.0.0.1:8011", SHAFT_NO_START: "1" }
        run: irm http://127.0.0.1:8011/install.ps1 | iex
      - name: Locate the install
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then echo "SA=$(cygpath -u "$USERPROFILE")/ShaftAnalyser/shaft-analyser.exe" >> "$GITHUB_ENV"
          else echo "SA=$HOME/ShaftAnalyser/shaft-analyser" >> "$GITHUB_ENV"; test -L "$HOME/.local/bin/shaft-analyser"; fi
      - name: The earlier install was migrated
        shell: bash
        run: |
          H="$HOME"; [ "$RUNNER_OS" = Windows ] && H="$(cygpath -u "$USERPROFILE")"
          test -f "$H/ShaftAnalyser/workspace/shafts/old-shaft/shaft.json"
          test ! -e "$H/ShaftAnalyser/shafts"
          if [ "$RUNNER_OS" = Windows ]; then test ! -e "$H/Downloads/ShaftAnalyser"; test -f "$H/ShaftAnalyser/workspace/old_config/0/defaults.yaml"; fi
          curl -sf http://127.0.0.1:8765/api/shafts > /dev/null || true
      - name: Version
        shell: bash
        run: '"$SA" version | grep -F "${{ needs.build.outputs.version }}"'
      - name: Self-check (whole pipeline on the synthetic shaft, against its ground truth)
        shell: bash
        run: '"$SA" check'
      - name: Doctor
        shell: bash
        run: '"$SA" doctor'
      - name: The app serves its page
        shell: bash
        run: |
          "$SA" start --no-browser > serve.log 2>&1 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/ | grep -q "Shaft Analyser"
          curl -sf http://127.0.0.1:8765/api/version | grep -q "${{ needs.build.outputs.version }}"
      # SC-012: the click, Inspect and Back flow, untimed, on the synthetic kink shaft the self-check just processed.
      # tools/m7/flow.py needs only a Python and Playwright; it drives the runner's own Chrome (Edge on Windows) and
      # --adopt registers the self-check's scan in this install's workspace (a client's app never lists it by itself).
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.decide.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: source
          sparse-checkout: tools/m7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: The click, Inspect and Back flow on the synthetic kink shaft (SC-012)
        shell: bash
        run: |
          H="$HOME"; [ "$RUNNER_OS" = Windows ] && H="$(cygpath -m "$USERPROFILE")"
          # the app started above keeps running; if the runner ended it with that step, start it again
          curl -sf http://127.0.0.1:8765/api/health > /dev/null || { "$SA" start --no-browser > serve-flow.log 2>&1 & }
          for i in $(seq 120); do curl -sf http://127.0.0.1:8765/api/health > /dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/api/health > /dev/null
          python -m pip install --quiet playwright==1.64.1
          python source/tools/m7/flow.py --adopt "$H/ShaftAnalyser/workspace/self_check/scan" --report flow-report/flow.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-${{ matrix.plat }}
          path: flow-report/flow.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-${{ matrix.plat }}
          path: ~/ShaftAnalyser/workspace/self_check/score.json

  update-e2e:
    # Before anything is published: a copy of the previous release, started as a user would, must update itself to this
    # build. The build is served on the runner the way github.com serves a release (…/latest redirects to …/tag/<new>,
    # …/download/<new>/<file> redirects to the file) and the copy looks there for updates (SHAFT_UPDATE_BASE).
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: windows-x64, exe: shaft-analyser.exe }
          - { os: ubuntu-latest, plat: linux-x64, exe: shaft-analyser }
          - { os: macos-14, plat: macos-arm64, exe: shaft-analyser }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SHAFT_UPDATE_CHECK_S: "10"
      SHAFT_NOTIFY: "0"
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-common, path: dist }
      - name: Previous release
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --repo "$RELEASES_REPO" --limit 5 --json tagName -q '.[].tagName' | { grep -v "^${{ needs.build.outputs.version }}$" || true; } | head -1)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "previous release: ${prev:-none}"
      - name: Serve this build as the newest release (127.0.0.1:8012)
        if: steps.prev.outputs.tag != ''
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release_server.py" <<'EOF'
          # github.com's release links, for one release: HEAD/GET /latest -> 302 /tag/<tag>;
          # /download/<tag>/<file> -> 302 /files/<file> (github.com sends files from another host) -> 200
          import http.server, os, shutil, sys
          DIST, TAG, PORT = sys.argv[1], sys.argv[2], int(sys.argv[3])
          BASE = "http://127.0.0.1:%d" % PORT
          FILES = set(os.listdir(DIST))
          class H(http.server.BaseHTTPRequestHandler):
              def reply(self, code, location=None, name=None, body=True):
                  self.send_response(code)
                  if location:
                      self.send_header("Location", location)
                  path = os.path.join(DIST, name) if name else None
                  self.send_header("Content-Length", str(os.path.getsize(path) if path else 0))
                  if path:
                      self.send_header("Content-Type", "application/octet-stream")
                  self.end_headers()
                  if path and body:
                      with open(path, "rb") as f:
                          shutil.copyfileobj(f, self.wfile)
              def route(self, body):
                  p = self.path.split("?")[0]
                  dl, fl = "/download/%s/" % TAG, "/files/"
                  if p == "/latest":
                      return self.reply(302, BASE + "/tag/" + TAG)
                  if p.startswith(dl) and p[len(dl):] in FILES:
                      return self.reply(302, BASE + fl + p[len(dl):])
                  if p.startswith(fl) and p[len(fl):] in FILES:
                      return self.reply(200, name=p[len(fl):], body=body)
                  return self.reply(404)
              def do_HEAD(self):
                  self.route(False)
              def do_GET(self):
                  self.route(True)
          http.server.ThreadingHTTPServer(("127.0.0.1", PORT), H).serve_forever()
          EOF
          PY=$(command -v python3 || command -v python)
          ("$PY" -I "$RUNNER_TEMP/release_server.py" dist "${{ needs.build.outputs.version }}" 8012 > "$RUNNER_TEMP/release_server.log" 2>&1 &)
          for i in $(seq 30); do
            loc=$(curl -sI http://127.0.0.1:8012/latest | tr -d '\r' | sed -n 's/^[Ll]ocation: //p' || true)
            [ -n "$loc" ] && break; sleep 1
          done
          echo "http://127.0.0.1:8012/latest -> $loc"
          test "$(curl -fsSL http://127.0.0.1:8012/download/${{ needs.build.outputs.version }}/checksums.txt)" = "$(cat dist/checksums.txt)"
      - name: Install the previous release and let it update itself to this build
        if: steps.prev.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHAFT_UPDATE_BASE: "http://127.0.0.1:8012"
        run: |
          P=${{ steps.prev.outputs.tag }}; N=${{ needs.build.outputs.version }}
          mkdir -p "$RUNNER_TEMP/old" && cd "$RUNNER_TEMP/old"
          gh release download "$P" --repo "$RELEASES_REPO" --pattern "ShaftAnalyser-$P-${{ matrix.plat }}.zip"
          unzip -q "ShaftAnalyser-$P-${{ matrix.plat }}.zip"
          chmod +x ShaftAnalyser/shaft-analyser 2>/dev/null || true
          ./ShaftAnalyser/${{ matrix.exe }} start --no-browser > run.log 2>&1 &
          for i in $(seq 900); do
            v=$(curl -s http://127.0.0.1:8765/api/version || true)
            case "$v" in *"\"version\":\"$N\""*'"state":"updated"'*) echo "updated $P -> $N after $((i*2)) s"; exit 0;; esac
            sleep 2
          done
          echo "did not update"; cat run.log; exit 1
      - name: What the copy asked for
        if: always() && steps.prev.outputs.tag != ''
        shell: bash
        run: cat "$RUNNER_TEMP/release_server.log" || true

  scenarios:
    # the client-machine scenarios (scenarios.yml), side by side with verify and update-e2e
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/scenarios.yml
    with:
      version: ${{ needs.build.outputs.version }}

  publish:
    # only after every check above passed; a dry run stops before anything is published
    needs: [decide, test, build, verify, update-e2e, scenarios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.dry_run }}
        with: { repository: "${{ env.SOURCE_REPO }}", ref: "${{ needs.decide.outputs.sha }}", token: "${{ secrets.SOURCE_TOKEN }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: release-*, path: dist, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: score-*, path: scores }
      - name: The release is exactly the files built and checked, each one matching checksums.txt
        working-directory: dist
        run: |
          sha256sum --strict -c checksums.txt
          diff <(awk '{print $2}' checksums.txt | sort) <(for f in *; do [ "$f" = checksums.txt ] || echo "$f"; done | sort)
      - name: Release notes
        run: |
          V=${{ needs.build.outputs.version }}
          {
            echo "Shaft Analyser $V — passed every check before release."
            echo
            echo "| Platform | Self-check on the synthetic shaft | Four classes wrong |"
            echo "|---|---|---|"
            for d in scores/score-*; do
              p=${d#scores/score-}
              python3 - "$d/score.json" "$p" <<'EOF'
          import json, sys
          s = json.load(open(sys.argv[1]))
          checks = [v for v in s.values() if isinstance(v, dict) and "pass" in v]
          ok = sum(1 for c in checks if c["pass"])
          w = next((v.get("wrong_pct") for k, v in s.items() if "four classes" in k), None)
          print(f"| {sys.argv[2]} | {ok}/{len(checks)} criteria passed | {w} % |")
          EOF
            done
            echo
            echo "Install or upgrade with one command:"
            echo
            echo '- macOS / Linux: `curl -fsSL https://github.com/Saif0089/shaft-analyser-releases/releases/latest/download/install.sh | sh`'
            echo '- Windows PowerShell: `irm https://github.com/Saif0089/shaft-analyser-releases/releases/latest/download/install.ps1 | iex`'
            echo '- Windows cmd: `powershell -NoProfile -c "irm https://github.com/Saif0089/shaft-analyser-releases/releases/latest/download/install.ps1 | iex"`'
            echo
            echo "Installed copies update themselves to this version (verified against checksums.txt)."
            echo
            echo "Commit: ${{ needs.decide.outputs.sha }}"
          } > notes.md
          cat notes.md
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$DRY_RUN" = false ] || { echo "dry run: nothing is published"; exit 1; }
          V=${{ needs.build.outputs.version }}
          gh release create "$V" --repo "$RELEASES_REPO" --title "Shaft Analyser $V" --notes-file notes.md dist/*
      - name: Tag the source
        if: ${{ !inputs.dry_run }}
        run: |
          [ "$DRY_RUN" = false ] || { echo "dry run: no tag"; exit 1; }
          git tag "${{ needs.build.outputs.version }}" && git push origin "${{ needs.build.outputs.version }}" || echo "tag not pushed"
      - name: Dry run — nothing published
        if: ${{ inputs.dry_run }}
        run: |
          echo "Every check passed. Not published (dry run): ${{ needs.build.outputs.version }} of ${{ needs.decide.outputs.sha }}, with:"
          ls -l dist

  published:
    # The release as github.com now serves it to installed copies and the one-line installers: …/latest points at it and
    # every file downloads intact (the same checksums.txt as the build checked above).
    needs: [build, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-common, path: built }
      - name: Download the published release from github.com and check it
        run: |
          N=${{ needs.build.outputs.version }}; R="https://github.com/$RELEASES_REPO/releases"
          for i in $(seq 36); do
            loc=$(curl -sS -o /dev/null -w '%{redirect_url}' -I "$R/latest" || true)
            case "$loc" in */tag/"$N") break;; esac
            sleep 5
          done
          echo "$R/latest -> $loc"
          case "$loc" in */tag/"$N") ;; *) echo "…/latest does not point at $N"; exit 1;; esac
          get() { curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o "$2" "$1"; }
          mkdir pub && cd pub
          get "$R/download/$N/checksums.txt" checksums.txt
          cmp checksums.txt ../built/checksums.txt
          while read -r _ f; do get "$R/download/$N/$f" "$f"; done < checksums.txt
          sha256sum --strict -c checksums.txt
          for f in install.sh install.ps1; do get "$R/latest/download/$f" "latest-$f"; cmp "latest-$f" "$f"; done

  report-failure:
    needs: [decide, test, build, verify, update-e2e, scenarios, publish, published]
    # not for a dry run, nor for source_ref without one (refused by decide: the operator's slip, not a blocked release)
    if: failure() && !inputs.dry_run && inputs.source_ref == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          gh issue create --repo "$SOURCE_REPO" \
            --title "Release blocked: ${{ github.workflow }} #${{ github.run_number }} failed" \
            --body "No release was published (or the check of the published release failed after publishing). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — commit ${{ needs.decide.outputs.sha }}"
